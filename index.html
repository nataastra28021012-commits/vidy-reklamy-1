<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Рекламные форматы 2ГИС</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #32be7c;
      --green-dark: #259663;
      --ink: #1d2b2a;
      --muted: #63716f;
      --line: #dce7e4;
      --surface: #f2f7f5;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: var(--white);
      font-family: Inter, Arial, sans-serif;
      font-size: 18px;
      line-height: 1.55;
    }

    .page {
      width: min(1180px, calc(100% - 48px));
      margin: 0 auto;
      padding: 64px 0;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--green-dark);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 760px;
      margin: 0 0 36px;
      font-size: clamp(32px, 5vw, 54px);
      line-height: 1.12;
      letter-spacing: -0.04em;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab {
      display: flex;
      align-items: center;
      min-height: 72px;
      padding: 14px 16px;
      border: 1px solid var(--green);
      border-radius: 14px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.72);
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.25;
      justify-content: center;
       text-align: center;
      cursor: pointer;
      transition: background .2s ease, border-color .2s ease, color .2s ease, transform .2s ease;
    }

    .tab:hover { transform: translateY(-2px); border-color: var(--green); }
    .tab:focus-visible { outline: 3px solid rgba(0, 168, 120, .35); outline-offset: 3px; }
    .tab[aria-selected="true"] { color: var(--white); background: var(--green); border-color: var(--green); }

    .card {
      display: grid;
      grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr);
      gap: clamp(28px, 4vw, 56px);
      align-items: start;
      padding: clamp(28px, 5vw, 58px);
      border-radius: 24px;
      background: var(--white);
      box-shadow: 0 16px 45px rgba(33, 70, 59, .10);
    }

    .card.is-empty {
      display: block;
      min-height: 228px;
      padding: 32px;
      background: #f3f5f6;
      box-shadow: none;
    }

    .hint {
      margin: 0;
      color: #63708a;
      font-size: 18px;
      font-style: italic;
      line-height: 1.45;
    }

    .card.is-empty .content,
    .card.is-empty .image-box { display: none; }

    .content {
      max-width: 620px;
      animation: reveal .28s ease both;
    }

    h2 {
      display: inline;
      margin: 0;
      color: #14213a;
      font-size: clamp(26px, 3vw, 32px);
      font-weight: 700;
      line-height: 1.22;
      letter-spacing: -0.025em;
    }

    .description {
      max-width: 900px;
      margin: 0 0 48px;
      color: #172033;
      font-size: 16px;
      font-weight: 700;
       line-height: 1.5;
    }

    .benefits {
      display: grid;
      gap: 12px;
      max-width: 620px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .benefit {
      padding: 13px 16px;
      border-left: 4px solid var(--green);
      color: #14213a;
      background: #f5f7fa;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.35;
    }

    .benefit strong { font-weight: inherit; }

    @media (max-width: 520px) {
      .description { margin: 20px 0 32px; }
      .benefit { padding: 12px; }
    }

    .image-box {
      position: relative;
      display: grid;
      width: 100%;
      min-height: 360px;
      margin: 42px 0 0;
      overflow: hidden;
      border-radius: 22px;
      background: transparent;
      place-items: center;
    }

    .image-box img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 720px;
      border-radius: 12px;
      object-fit: contain;
      background: var(--white);
      box-shadow: 0 8px 24px rgba(31, 64, 55, .12);
      cursor: zoom-in;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .image-box img:hover {
      transform: scale(1.015);
      box-shadow: 0 12px 30px rgba(31, 64, 55, .18);
    }

    .lightbox {
      position: fixed;
      z-index: 1000;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 32px;
      background: rgba(20, 33, 58, .82);
      cursor: zoom-out;
    }

    .lightbox.is-open { display: flex; }

    .lightbox img {
      display: block;
      max-width: min(1200px, 100%);
      max-height: calc(100vh - 64px);
      border-radius: 12px;
      object-fit: contain;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .35);
      cursor: default;
    }

    .lightbox-close {
      position: absolute;
      top: 18px;
      right: 22px;
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      color: var(--ink);
      background: var(--white);
      font-size: 30px;
      line-height: 1;
      cursor: pointer;
    }

    @media (max-width: 520px) {
      .lightbox { padding: 16px; }
      .lightbox img { max-height: calc(100vh - 32px); }
      .lightbox-close { top: 10px; right: 10px; }
    }

    .image-box.empty { display: none; }

    /* Текстовые блоки всех форматов начинаются на одной высоте. */
    .card { align-items: start; }

    @keyframes reveal { from { opacity: .35; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    @media (max-width: 850px) {
      .tabs { grid-template-columns: repeat(2, 1fr); }
      .card { grid-template-columns: 1fr; min-height: 0; }
      .image-box, .image-box img { min-height: 300px; }
    }

    @media (max-width: 520px) {
      .page { width: min(100% - 28px, 1180px); padding: 32px 0; }
      .tabs { grid-template-columns: 1fr; }
      .card { padding: 24px; border-radius: 18px; }
      .image-box, .image-box img { min-height: 240px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="tabs" role="tablist" aria-label="Форматы рекламы">
      <button class="tab" role="tab" id="tab-geo" aria-controls="panel" aria-selected="false" data-key="geo">Геоконтекстная реклама</button>
      <button class="tab" role="tab" id="tab-media" aria-controls="panel" aria-selected="false" data-key="media">Медийная реклама</button>
      <button class="tab" role="tab" id="tab-nav" aria-controls="panel" aria-selected="false" data-key="nav">Реклама в навигаторе</button>
      <button class="tab" role="tab" id="tab-3d" aria-controls="panel" aria-selected="false" data-key="3d">Иммерсивные 3D-модели</button>
    </div>

    <section class="card is-empty" id="panel" role="tabpanel" tabindex="0">
      <p class="hint" id="hint">Нажимай на вкладки, чтобы узнать подробнее</p>
      <div class="content" id="content"></div>
      <div class="image-box empty" id="imageBox">
        <img id="formatImage" alt="">
        <div class="placeholder" id="placeholder"></div>
      </div>
    </section>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Увеличенное изображение" aria-hidden="true">
    <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Закрыть изображение">×</button>
    <img id="lightboxImage" alt="">
  </div>

  <script>
    const formats = {
      geo: {
        title: 'Геоконтекстная реклама',
        intro: 'Учитывает интересы пользователя к определённым товарам и услугам и предлагает компании с точностью<br>до улицы:',
        bullets: [
          'преимущество в поисковой выдаче по сравнению<br>с нерекламодателями;',
          'предложение видят заинтересованные пользователи<br>с учётом их местоположения;',
          'в карточках компаний с геоконтекстной рекламой отключён показ предложений похожих организаций.'
        ],
        imageNames: ['геоконтекстная реклама', 'geokontekstnaya-reklama']
      },
      media: {
        title: 'Медийная реклама',
        intro: 'Продающая и имиджевая реклама с самым большим охватом на всех платформах справочника 2ГИС:',
        bullets: ['логотип на карте;', 'сторис на дашборде;', 'баннер на стартовом экране;', 'рекламный блок в погоде;', 'реклама в нужную рубрику.'],
        imageNames: ['медийная реклама', 'mediynaya-reklama']
      },
      nav: {
        title: 'Реклама в навигаторе',
        intro: 'Во время поездок автомобилисты увидят рекламу,<br>которая включает в себя:',
        bullets: ['билборд на карте;', 'баннер на карте;', 'баннер при остановке.'],
        imageNames: ['в навигаторе', 'v-navigatore']
      },
      '3d': {
        title: 'Иммерсивные 3D-модели',
        intro: 'Создаются и публикуются 3D-модели в 2ГИС:',
        bullets: [
          'жилые комплексы для демонстрации уникальной архитектуры;',
          'торговые центры, базы отдыха, самолёты;',
          'другие объекты для повышения заметности на карте.'
        ],
        imageNames: ['3д', '3d']
      }
    };

    const extensions = ['png', 'jpg', 'jpeg', 'webp'];
    const buttons = document.querySelectorAll('.tab');
    const content = document.getElementById('content');
    const image = document.getElementById('formatImage');
    const imageBox = document.getElementById('imageBox');
    const placeholder = document.getElementById('placeholder');
    const panel = document.getElementById('panel');
    const hint = document.getElementById('hint');
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightboxImage');
    const lightboxClose = document.getElementById('lightboxClose');
    let currentKey = null;

    function closeLightbox() {
      lightbox.classList.remove('is-open');
      lightbox.setAttribute('aria-hidden', 'true');
      lightboxImage.removeAttribute('src');
    }

    image.addEventListener('click', () => {
      if (!image.src || imageBox.classList.contains('empty')) return;
      lightboxImage.src = image.src;
      lightboxImage.alt = image.alt;
      lightbox.classList.add('is-open');
      lightbox.setAttribute('aria-hidden', 'false');
      lightboxClose.focus();
    });

    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', event => {
      if (event.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && lightbox.classList.contains('is-open')) closeLightbox();
    });

    function findLocalImage(names, onFound, onMissing) {
      const candidates = names.flatMap(name => extensions.map(ext => `${name}.${ext}`));
      let index = 0;
      const testNext = () => {
        if (index >= candidates.length) return onMissing();
        const src = candidates[index++];
        const probe = new Image();
        probe.onload = () => onFound(src);
        probe.onerror = testNext;
        probe.src = src;
      };
      testNext();
    }

    function showFormat(key) {
      currentKey = key;
      const item = formats[key];
      panel.classList.remove('is-empty');
      hint.hidden = true;
      content.innerHTML = `
        <p class="description">${item.intro}</p>
        <ul class="benefits">
          ${item.bullets.map(bullet => `
            <li class="benefit">${bullet}</li>
          `).join('')}
        </ul>
      `;

      image.alt = item.title;
      image.removeAttribute('src');
      imageBox.classList.add('empty');
      placeholder.textContent = '';

      findLocalImage(
        item.imageNames,
        src => {
          if (currentKey !== key) return;
          image.src = src;
          imageBox.classList.remove('empty');
        },
        () => {
          if (currentKey === key) imageBox.classList.add('empty');
        }
      );

      buttons.forEach(button => {
        const selected = button.dataset.key === key;
        button.setAttribute('aria-selected', selected);
      });
      panel.setAttribute('aria-labelledby', `tab-${key}`);
    }

    buttons.forEach(button => button.addEventListener('click', () => showFormat(button.dataset.key)));
  </script>
</body>
</html>
